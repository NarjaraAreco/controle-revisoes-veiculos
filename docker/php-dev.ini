[opcache]
; O Laravel Sail usa o PHP CLI com `artisan serve`.
; Habilitar OPcache reduz o custo de recompilar o framework a cada requisição.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; O PHP CLI fica ativo no servidor do Sail; não verificar milhares de arquivos
; do volume compartilhado a cada requisição. Reinicie o container após alterar
; arquivos PHP para recarregar o código.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
